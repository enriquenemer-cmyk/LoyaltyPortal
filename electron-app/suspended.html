<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>3E Plataforma — Cuenta Suspendida</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    background: #FAFAF9; display: flex; align-items: center;
    justify-content: center; min-height: 100vh; padding: 24px;
  }
  .card {
    background: #fff; border: 2px solid #111; border-radius: 16px;
    box-shadow: 6px 6px 0 #111; padding: 40px; width: 100%; max-width: 400px; text-align: center;
  }
  .icon { font-size: 56px; margin-bottom: 16px; }
  h1 { font-size: 22px; font-weight: 800; margin-bottom: 10px; color: #111; }
  p { color: #666; font-size: 14px; line-height: 1.6; margin-bottom: 16px; }
  .reason {
    background: #fff7ed; border: 2px solid #F97316; border-radius: 10px;
    padding: 14px; color: #c2410c; font-size: 13px; font-weight: 600; margin-bottom: 24px;
  }
  a {
    display: inline-block; padding: 12px 28px; background: #111; color: #fff;
    border-radius: 10px; font-weight: 700; font-size: 14px; text-decoration: none;
    box-shadow: 3px 3px 0 #F97316;
  }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔒</div>
  <h1>Cuenta suspendida</h1>
  <p>Tu licencia de 3E Plataforma ha sido suspendida.</p>
  <div class="reason" id="reason">Contacta a 3E para más información.</div>
  <a href="mailto:enriquenemer@gmail.com">Contactar a 3E</a>
</div>
</body>
</html>
