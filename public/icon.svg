<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8521A"/>
      <stop offset="50%" style="stop-color:#C2410C"/>
      <stop offset="100%" style="stop-color:#7C2D12"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.28"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7C2D12" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Fondo circular -->
  <circle cx="50" cy="50" r="50" fill="url(#bg)"/>

  <!-- Brillo superior -->
  <ellipse cx="50" cy="28" rx="32" ry="18" fill="url(#shine)"/>

  <!-- Icono de regalo -->
  <!-- Cinta horizontal -->
  <rect x="22" y="46" width="56" height="8" rx="3" fill="white" opacity="0.95" filter="url(#shadow)"/>
  <!-- Caja del regalo -->
  <rect x="27" y="54" width="46" height="26" rx="3" fill="white" opacity="0.9"/>
  <!-- Lazo izquierdo -->
  <path d="M50 46 Q38 34 30 38 Q26 40 30 44 Q36 48 50 46Z" fill="white" opacity="0.95"/>
  <!-- Lazo derecho -->
  <path d="M50 46 Q62 34 70 38 Q74 40 70 44 Q64 48 50 46Z" fill="white" opacity="0.95"/>
  <!-- Cinta vertical -->
  <rect x="46" y="44" width="8" height="36" rx="2" fill="url(#bg)" opacity="0.75"/>
  <!-- Nudo central del lazo -->
  <circle cx="50" cy="46" r="4.5" fill="url(#bg)"/>
  <circle cx="50" cy="46" r="2.5" fill="white" opacity="0.9"/>
</svg>
