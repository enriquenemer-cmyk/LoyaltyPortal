<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Fire gradient for S -->
    <radialGradient id="fireGlow" cx="35%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FF3D00" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF0000" stop-opacity="0"/>
    </radialGradient>
    <!-- Electric gradient for T -->
    <radialGradient id="electricGlow" cx="65%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00CFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0080FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0040FF" stop-opacity="0"/>
    </radialGradient>
    <!-- S chrome gradient -->
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60CFFF"/>
      <stop offset="30%" stop-color="#2563EB"/>
      <stop offset="60%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <!-- S shine -->
    <linearGradient id="sShine" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <!-- T chrome gradient -->
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0E8FF"/>
      <stop offset="30%" stop-color="#A0B4D8"/>
      <stop offset="60%" stop-color="#6080B0"/>
      <stop offset="100%" stop-color="#C0D0F0"/>
    </linearGradient>
    <!-- Orange ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C00"/>
      <stop offset="50%" stop-color="#FF4400"/>
      <stop offset="100%" stop-color="#FF6600"/>
    </linearGradient>
    <!-- Outer glow filter -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowS" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feFlood flood-color="#2563EB" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowT" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#94A3B8" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="spark" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background circle dark -->
  <circle cx="100" cy="100" r="90" fill="#0A0E1A" opacity="0.85"/>

  <!-- Fire glow background left -->
  <ellipse cx="72" cy="115" rx="60" ry="55" fill="url(#fireGlow)" opacity="0.8"/>
  <!-- Electric glow background right -->
  <ellipse cx="128" cy="85" rx="60" ry="55" fill="url(#electricGlow)" opacity="0.7"/>

  <!-- Orange ring arc (left side) -->
  <path d="M 38 140 Q 18 100 38 60 Q 55 30 85 22" fill="none" stroke="url(#ringGrad)" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  <path d="M 34 138 Q 14 100 36 58" fill="none" stroke="#FF6600" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- Blue arc (right side) -->
  <path d="M 162 60 Q 182 100 162 140 Q 145 168 115 175" fill="none" stroke="#00CFFF" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 166 62 Q 186 100 164 142" fill="none" stroke="#60E0FF" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- S letter - dark outline/shadow -->
  <text x="42" y="133" font-family="Arial Black, Impact, sans-serif" font-size="90" font-weight="900"
        fill="#001040" letter-spacing="-5" opacity="0.6" transform="translate(3,3)">S</text>
  <!-- S letter - main chrome blue -->
  <text x="42" y="133" font-family="Arial Black, Impact, sans-serif" font-size="90" font-weight="900"
        fill="url(#sGrad)" filter="url(#glowS)" letter-spacing="-5">S</text>
  <!-- S shine overlay -->
  <text x="42" y="133" font-family="Arial Black, Impact, sans-serif" font-size="90" font-weight="900"
        fill="url(#sShine)" letter-spacing="-5" opacity="0.5">S</text>

  <!-- T letter - dark shadow -->
  <text x="105" y="133" font-family="Arial Black, Impact, sans-serif" font-size="85" font-weight="900"
        fill="#000820" letter-spacing="-5" opacity="0.5" transform="translate(3,3)">T</text>
  <!-- T letter - chrome silver -->
  <text x="105" y="133" font-family="Arial Black, Impact, sans-serif" font-size="85" font-weight="900"
        fill="url(#tGrad)" filter="url(#glowT)" letter-spacing="-5">T</text>

  <!-- Lightning bolt accent -->
  <path d="M 148 50 L 138 80 L 148 80 L 136 112" stroke="#00DFFF" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M 152 52 L 142 78 L 152 78 L 140 108" stroke="white" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.4"/>

  <!-- Fire sparks left -->
  <circle cx="45" cy="55" r="3" fill="#FF6600" filter="url(#spark)" opacity="0.9"/>
  <circle cx="32" cy="75" r="2" fill="#FF8C00" filter="url(#spark)" opacity="0.7"/>
  <circle cx="55" cy="42" r="1.5" fill="#FFAA00" filter="url(#spark)" opacity="0.8"/>
  <circle cx="28" cy="110" r="2.5" fill="#FF4400" filter="url(#spark)" opacity="0.6"/>
  <circle cx="40" cy="155" r="2" fill="#FF6600" filter="url(#spark)" opacity="0.5"/>
  <circle cx="60" cy="165" r="1.5" fill="#FF8800" filter="url(#spark)" opacity="0.7"/>

  <!-- Electric sparks right -->
  <circle cx="158" cy="55" r="2.5" fill="#00CFFF" filter="url(#spark)" opacity="0.9"/>
  <circle cx="170" cy="80" r="2" fill="#60E0FF" filter="url(#spark)" opacity="0.7"/>
  <circle cx="165" cy="130" r="1.5" fill="#00AAFF" filter="url(#spark)" opacity="0.8"/>
  <circle cx="155" cy="155" r="2" fill="#40C0FF" filter="url(#spark)" opacity="0.6"/>

  <!-- Bottom reflection -->
  <ellipse cx="100" cy="188" rx="55" ry="6" fill="#FF4400" opacity="0.2"/>
  <ellipse cx="130" cy="190" rx="30" ry="4" fill="#00CFFF" opacity="0.15"/>
</svg>
